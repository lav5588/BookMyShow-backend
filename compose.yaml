services:
  database:
    image: postgres:18
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: lav
      POSTGRES_PASSWORD: password1
      POSTGRES_DB: bookmyshowdb
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lav -d bookmyshowdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: